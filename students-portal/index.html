<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentHub – Technical Directory</title>
  <meta name="description" content="Browse 100 students by tech stack — MERN, MEAN, Python, Android, iOS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <div>
          <span class="logo-title">StudentHub</span>
          <span class="logo-sub">Technical Directory</span>
        </div>
      </div>
      <div class="header-meta">
        <button class="auth-toggle-btn" id="authBtn" title="Log In with Auth0 to unlock unmasked contacts">
          <span id="authIcon">🔒</span> <span id="authText">Log In with Auth0</span>
        </button>
        <span class="badge-total" id="totalBadge">Loading…</span>
      </div>
    </div>
  </header>

  <section class="stats-strip" id="statsStrip"></section>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" class="search-input" placeholder="Search by name or email…" autocomplete="off" />
        <button class="clear-btn" id="clearSearch" title="Clear">✕</button>
      </div>
      <div class="stack-filters" id="stackFilters">
        <button class="filter-btn active" data-stack="ALL">All Stacks</button>
        <button class="filter-btn mern"    data-stack="MERN">MERN</button>
        <button class="filter-btn mean"    data-stack="MEAN">MEAN</button>
        <button class="filter-btn python"  data-stack="Python">Python</button>
        <button class="filter-btn android" data-stack="Android">Android</button>
        <button class="filter-btn ios"     data-stack="iOS">iOS</button>
      </div>
      <div class="sort-wrap">
        <label for="sortSelect" class="sort-label">Sort:</label>
        <select id="sortSelect" class="sort-select">
          <option value="id-asc">ID ↑</option>
          <option value="id-desc">ID ↓</option>
          <option value="name-asc">Name A→Z</option>
          <option value="name-desc">Name Z→A</option>
        </select>
      </div>
    </div>
  </div>

  <div class="results-bar">
    <span id="resultsCount"></span>
    <span id="activeFiltersDisplay"></span>
  </div>

  <main class="main-content">
    <div class="student-grid" id="studentGrid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
