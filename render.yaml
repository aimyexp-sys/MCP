services:
  # -------------------------------------------------------------
  # 1. Student API Backend Server
  # -------------------------------------------------------------
  - type: web
    name: students-server
    runtime: node
    plan: free
    rootDir: students-server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: STUDENT_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # 2. Student Directory Portal Frontend
  # -------------------------------------------------------------
  - type: web
    name: students-portal
    runtime: static
    rootDir: students-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: students-server
          property: host

  # -------------------------------------------------------------
  # 3. Job Portal API Backend Server
  # -------------------------------------------------------------
  - type: web
    name: job-portal-server
    runtime: node
    plan: free
    rootDir: job-portal-server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JOB_ADMIN_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # 4. Job Vacancies Web App Frontend
  # -------------------------------------------------------------
  - type: web
    name: job-portal-web
    runtime: static
    rootDir: job-portal-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: job-portal-server
          property: host

  # -------------------------------------------------------------
  # 5. Model Context Protocol (MCP) Server (HTTP / SSE Transport)
  # -------------------------------------------------------------
  - type: web
    name: exp-portal-mcp-server
    runtime: node
    plan: free
    rootDir: mcp-server
    buildCommand: npm install
    startCommand: npm run start:sse
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MCP_API_KEY
        value: mcp-secret-key-2026
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: STUDENTS_API_URL
        fromService:
          type: web
          name: students-server
          property: host
      - key: JOBS_API_URL
        fromService:
          type: web
          name: job-portal-server
          property: host
      - key: STUDENT_API_KEY
        fromService:
          type: web
          name: students-server
          envVarKey: STUDENT_API_KEY
      - key: JOB_ADMIN_KEY
        fromService:
          type: web
          name: job-portal-server
          envVarKey: JOB_ADMIN_KEY
