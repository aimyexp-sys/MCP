services:
  # -------------------------------------------------------------
  # 1. Student API Backend Server
  # -------------------------------------------------------------
  - type: web
    name: students-server
    runtime: node
    plan: free
    rootDir: students-server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:5174,https://students-portal.onrender.com,https://job-portal-web.onrender.com,https://exp-portal-mcp-server.onrender.com"
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        value: "https://students-server.onrender.com/api"

  # -------------------------------------------------------------
  # 2. Student Directory Portal Frontend
  # -------------------------------------------------------------
  - type: web
    name: students-portal
    runtime: static
    rootDir: students-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: students-server
          property: host
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        value: "https://students-server.onrender.com/api"

  # -------------------------------------------------------------
  # 3. Job Portal API Backend Server
  # -------------------------------------------------------------
  - type: web
    name: job-portal-server
    runtime: node
    plan: free
    rootDir: job-portal-server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:5174,https://students-portal.onrender.com,https://job-portal-web.onrender.com,https://exp-portal-mcp-server.onrender.com"
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        value: "https://job-portal-server.onrender.com/api"

  # -------------------------------------------------------------
  # 4. Job Vacancies Web App Frontend
  # -------------------------------------------------------------
  - type: web
    name: job-portal-web
    runtime: static
    rootDir: job-portal-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: job-portal-server
          property: host
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        value: "https://job-portal-server.onrender.com/api"

  # -------------------------------------------------------------
  # 5. Model Context Protocol (MCP) Server (HTTP / SSE Transport)
  # -------------------------------------------------------------
  - type: web
    name: exp-portal-mcp-server
    runtime: node
    plan: free
    rootDir: mcp-server
    buildCommand: npm install
    startCommand: npm run start:sse
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:5174,https://students-portal.onrender.com,https://job-portal-web.onrender.com,https://exp-portal-mcp-server.onrender.com"
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        value: "https://exp-portal-mcp-server.onrender.com"
      - key: STUDENTS_API_URL
        fromService:
          type: web
          name: students-server
          property: host
      - key: JOBS_API_URL
        fromService:
          type: web
          name: job-portal-server
          property: host
